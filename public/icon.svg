<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="filoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5003C0"/>
      <stop offset="100%" stop-color="#3C0294"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#5003C0" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#filoraGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle inner border -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Stylized Modern Geometric 'F' + Folded Document Motif -->
  <g fill="#FFFFFF">
    <!-- Main Vertical Stem -->
    <rect x="140" y="128" width="60" height="256" rx="20"/>
    
    <!-- Top Horizontal Bar -->
    <path d="M 140 148 C 140 136.95 148.95 128 160 128 L 332 128 C 343.05 128 352 136.95 352 148 L 352 168 C 352 179.05 343.05 188 332 188 L 200 188 L 200 188 L 160 188 C 148.95 188 140 179.05 140 168 Z"/>
    
    <!-- Middle Horizontal Bar -->
    <rect x="140" y="232" width="160" height="56" rx="18"/>

    <!-- Small document spark / corner accent -->
    <circle cx="332" cy="260" r="18" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
